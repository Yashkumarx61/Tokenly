name: Tokenly POS — CI/CD Pipeline & Automated Rollback

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # =========================================================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # =========================================================================

  lint-and-scan:
    name: 1. Lint, Static Analysis & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Code Analysis
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog-actions-scan@v3
        with:
          extra_args: --debug --only-verified

  unit-tests:
    name: 2. Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests

  security-audit:
    name: 3. Dependency & Container Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependency Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln GHSA-w596-4w79-c558 || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container for Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tokenly:test-scan

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tokenly:test-scan'
          format: 'table'
          exit-code: '0' # Set to 1 to block PRs on High/Critical vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: 4. Multi-Stage Docker Build & GHCR Push
    needs: [lint-and-scan, unit-tests, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT (CD) & AUTOMATED ROLLBACK
  # =========================================================================

  deploy-to-windows-vps:
    name: 5. Windows Server Deployment & Health Verification
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, Server] # Windows Server 2022 GitHub Actions Self-Hosted Runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment & Automated Rollback Script
        id: deploy
        shell: powershell
        run: |
          $TargetTag = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          Write-Host "Executing deployment script for image: $TargetTag"
          
          # Execute PowerShell deployment script
          ./scripts/deploy-with-rollback.ps1 -TargetImageTag $TargetTag -HealthCheckUrl "http://localhost:5000/healthz"

      - name: Capture Failure Diagnostic Logs (If Failed/Rolled Back)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-failure-logs
          path: failure_container_logs.log
          retention-days: 7

      - name: Send Slack Deployment Status Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          if_mention: failure
