<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- App Icon Box Gradient -->
    <linearGradient id="iconBoxGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Ribbon Left Stem Gradient -->
    <linearGradient id="ribbonLeftGrad" x1="20" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Ribbon Right & Top Crossbar Gradient -->
    <linearGradient id="ribbonRightGrad" x1="180" y1="20" x2="90" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Metallic Rim Highlight -->
    <linearGradient id="rimGrad" x1="10" y1="20" x2="190" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background (As seen in image_88a968.jpg) -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#iconBoxGrad)" filter="url(#iconShadow)"/>

  <!-- Sculpted 3D Ribbon "T" Emblem -->
  <!-- Left Stem Ribbon -->
  <path d="M 45 48 C 62 48, 82 52, 86 82 L 86 155 C 86 163, 72 163, 72 155 L 72 90 C 72 68, 55 64, 45 64 Z" 
        fill="url(#ribbonLeftGrad)" stroke="url(#rimGrad)" stroke-width="1.2" opacity="0.95" />

  <!-- Right Curve & Crossbar Ribbon -->
  <path d="M 45 48 C 105 40, 162 40, 162 64 C 162 80, 134 80, 114 80 L 114 155 C 114 163, 100 163, 100 155 L 100 68 C 122 68, 150 64, 146 56 C 138 50, 92 52, 45 48 Z" 
        fill="url(#ribbonRightGrad)" stroke="url(#rimGrad)" stroke-width="1.2" />
</svg>
