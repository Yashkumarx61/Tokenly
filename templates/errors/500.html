{% extends "base.html" %}

<div class="min-h-[70vh] flex flex-col items-center justify-center text-center py-10 px-4 space-y-4">
    <div class="w-20 h-20 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-amber-500 font-extrabold text-3xl font-mono shadow-xl">
        500
    </div>
