<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKENLY — Cinematic 3D Logo Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1736;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .reveal-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0f224d 0%, #0b1736 70%, #060e22 100%);
        }

        /* Ambient Glow & Energy Rays */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.25) 0%, rgba(0, 128, 255, 0.1) 40%, rgba(11, 23, 54, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            animation: pulseGlow 4s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
        }

        @keyframes pulseGlow {
            0% { opacity: 0; transform: scale(0.4); }
            40% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.7; transform: scale(1); }
        }

        /* 3D Canvas Emblem Container */
        .emblem-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        canvas#particleCanvas {
            position: absolute;
            top: -60px;
            left: -60px;
            width: 400px;
            height: 400px;
            pointer-events: none;
        }

        .logo-svg {
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 0 25px rgba(0, 195, 255, 0.6)) drop-shadow(0 0 50px rgba(0, 102, 255, 0.4));
            transform: scale(0.85) rotateX(15deg);
            opacity: 0;
            animation: logoLock 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.2s;
        }

        @keyframes logoLock {
            0% {
                opacity: 0;
                transform: scale(0.6) rotateX(45deg) translateY(-20px);
                filter: drop-shadow(0 0 5px rgba(0, 195, 255, 0.2)) blur(10px);
            }
            60% {
                opacity: 1;
                transform: scale(1.05) rotateX(-5deg) translateY(0);
                filter: drop-shadow(0 0 35px rgba(0, 212, 255, 0.9)) blur(0px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateX(0deg) translateY(0);
                filter: drop-shadow(0 0 25px rgba(0, 195, 255, 0.65));
            }
        }

        /* SVG Ribbon Paths Animation */
        .ribbon-path-1, .ribbon-path-2 {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawRibbon 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.4s;
        }

        @keyframes drawRibbon {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Sweep Lens Flare */
        .lens-flare {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(0,229,255,0.8) 25%, rgba(0,128,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2);
            mix-blend-mode: screen;
            animation: flareSweep 1.8s ease-in-out forwards 2.4s;
        }

        @keyframes flareSweep {
            0% {
                opacity: 0;
                left: 30px;
                top: 40px;
                transform: scale(0.2);
            }
            30% {
                opacity: 1;
                transform: scale(1.4);
            }
            70% {
                opacity: 0.9;
                left: 240px;
                top: 40px;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                left: 260px;
                top: 40px;
                transform: scale(0.1);
            }
        }

        /* Typography Lockup */
        .brand-text {
            margin-top: 35px;
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 24px;
            text-indent: 24px;
            opacity: 0;
            transform: translateY(20px);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 0 0 40px rgba(0, 150, 255, 0.2);
            animation: fadeTextUp 2s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.0s;
        }

        @keyframes fadeTextUp {
            0% {
                opacity: 0;
                transform: translateY(25px);
                letter-spacing: 12px;
                text-indent: 12px;
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 22px;
                text-indent: 22px;
                filter: blur(0px);
            }
        }

        /* Tagline / Subtitle */
        .sub-tagline {
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 6px;
            text-indent: 6px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInSub 1.5s ease forwards 2.8s;
        }

        @keyframes fadeInSub {
            to {
                opacity: 0.8;
            }
        }

        /* Replay Control Button */
        .replay-btn {
            position: absolute;
            bottom: 35px;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 30px;
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            outline: none;
            opacity: 0;
            animation: fadeInSub 1s ease forwards 3.5s;
        }

        .replay-btn:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: #00d4ff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="reveal-container" id="revealContainer">
        <!-- Ambient Background Light -->
        <div class="ambient-glow" id="ambientGlow"></div>

        <!-- Emblem Wrapper -->
        <div class="emblem-wrapper">
            <!-- Particle Canvas for Flowing Energy Ribbons -->
            <canvas id="particleCanvas" width="400" height="400"></canvas>

            <!-- Vector 3D "T" Logo -->
            <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Left Ribbon Gradient -->
                    <linearGradient id="leftRibbonGrad" x1="20" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="50%" stop-color="#0284c7"/>
                        <stop offset="100%" stop-color="#0369a1"/>
                    </linearGradient>

                    <!-- Right Ribbon & Top Bar Gradient -->
                    <linearGradient id="rightRibbonGrad" x1="180" y1="20" x2="90" y2="180" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#38bdf8"/>
                        <stop offset="30%" stop-color="#00d4ff"/>
                        <stop offset="70%" stop-color="#0284c7"/>
                        <stop offset="100%" stop-color="#075985"/>
                    </linearGradient>

                    <!-- Top Bar Flare Glow -->
                    <linearGradient id="topGlowGrad" x1="10" y1="20" x2="190" y2="20" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#7dd3fc"/>
                        <stop offset="50%" stop-color="#00e5ff"/>
                        <stop offset="100%" stop-color="#0284c7"/>
                    </linearGradient>
                </defs>

                <!-- Stylized 3D Ribbon "T" Emblem -->
                <!-- Left Stem Ribbon -->
                <path class="ribbon-path-1" d="M 30 35 C 50 35, 75 40, 80 75 L 80 165 C 80 175, 65 175, 65 165 L 65 85 C 65 60, 45 55, 30 55 Z" fill="url(#leftRibbonGrad)" stroke="url(#topGlowGrad)" stroke-width="1.5" />
                
                <!-- Right Curve & Crossbar Ribbon -->
                <path class="ribbon-path-2" d="M 30 35 C 100 25, 175 25, 175 55 C 175 75, 140 75, 115 75 L 115 165 C 115 175, 100 175, 100 165 L 100 60 C 125 60, 160 55, 155 45 C 145 38, 90 40, 30 35 Z" fill="url(#rightRibbonGrad)" stroke="url(#topGlowGrad)" stroke-width="1.5" />
            </svg>

            <!-- Sweeping Lens Flare -->
            <div class="lens-flare" id="lensFlare"></div>
        </div>

        <!-- Typography Lockup -->
        <h1 class="brand-text">TOKENLY</h1>
        <div class="sub-tagline">POS & Restaurant Management Solution</div>

        <!-- Replay Button -->
        <button class="replay-btn" onclick="replayAnimation()">Replay Reveal ↻</button>
    </div>

    <script>
        // Particle System for Flowing Energy Ribbons
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animId;
        let startTime = Date.now();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.angle = Math.random() * Math.PI * 2;
                this.radius = 120 + Math.random() * 60;
                this.x = 200 + Math.cos(this.angle) * this.radius;
                this.y = 200 + Math.sin(this.angle) * this.radius;
                this.targetX = 200 + (Math.random() - 0.5) * 80;
                this.targetY = 200 + (Math.random() - 0.5) * 120;
                this.speed = 0.02 + Math.random() * 0.03;
                this.progress = 0;
                this.size = 1.5 + Math.random() * 2.5;
                this.alpha = 0.8 + Math.random() * 0.2;
                this.color = Math.random() > 0.5 ? '#00d4ff' : '#38bdf8';
            }

            update() {
                this.progress += this.speed;
                this.x += (this.targetX - this.x) * 0.04;
                this.y += (this.targetY - this.y) * 0.04;
                this.alpha = Math.max(0, 1 - this.progress);
                if (this.progress >= 1 || this.alpha <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const elapsed = (Date.now() - startTime) / 1000;

            if (elapsed < 3.5) {
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
            }
            animId = requestAnimationFrame(animateParticles);
        }

        function replayAnimation() {
            const container = document.getElementById('revealContainer');
            const clone = container.cloneNode(true);
            container.parentNode.replaceChild(clone, container);
            
            // Re-bind click event
            clone.querySelector('.replay-btn').addEventListener('click', replayAnimation);

            // Restart particles
            cancelAnimationFrame(animId);
            startTime = Date.now();
            initParticles();
            animateParticles();
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
